<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple UI + Block Hop</title><style>body{margin:30px auto;padding:0 20px;max-width:1000px;background:#25292e;color:#eeeeea;font:15px system-ui}h1{font-size:24px}p{color:#aeb4b7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}button{background:#25292e;color:#eee;border:1px solid #52585e;padding:12px 16px;cursor:pointer}button[aria-pressed=true],button:hover{background:#eeeeea;color:#25292e}button:focus-visible{outline:2px solid #aa8bd1;outline-offset:3px}img{width:100%;height:auto;display:block}audio{width:min(100%,480px)}section{margin-bottom:36px}</style><h1>Simple UI</h1><p>Matching screens and controls for the approved flat art.</p><nav aria-label="Screen preview"></nav><img id="screen" src="screens/main-menu.png" alt="Main menu art"><p>Artwork preview. These screens are not wired into the game.</p><section><h2>Block Hop</h2><p>Original 8-bit arcade loop · 150 BPM · 25.6 seconds</p><audio controls loop preload="metadata" src="audio/block-hop.wav"></audio></section><section><h2>UI pieces</h2><img src="ui-pieces.png" alt="Buttons, icons, sliders, toggles and panels"></section><script>const screens=['main-menu','pause','settings','game-over','how-to-play','restart-confirm'];const nav=document.querySelector('nav');screens.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name.replaceAll('-',' ');b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#screen').src='screens/'+name+'.png';document.querySelector('#screen').alt=b.textContent+' art'};nav.append(b)})</script></html>
