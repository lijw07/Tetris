<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect x="0" y="0" width="960" height="640" fill="#25292e" stroke="none" /><rect x="300.5" y="104.5" width="359" height="447" fill="#1b1e22" stroke="#52585e" /><text x="480" y="155" font-family="Menlo,monospace" font-size="24" fill="#eeeeea" text-anchor="middle">HOW TO PLAY</text><text x="480" y="186" font-family="Menlo,monospace" font-size="12" fill="#9ba1a4" text-anchor="middle">Fill a row to clear it.</text><rect x="340" y="193" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="213" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">← / →</text><text x="462" y="213" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Move</text><rect x="340" y="231" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="251" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">↑</text><text x="462" y="251" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Rotate</text><rect x="340" y="269" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="289" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">↓</text><text x="462" y="289" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Soft drop</text><rect x="340" y="307" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="327" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">SPACE</text><text x="462" y="327" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Hard drop</text><rect x="340" y="345" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="365" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">C</text><text x="462" y="365" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Hold</text><rect x="340" y="383" width="100" height="28" fill="#25292e" stroke="#52585e" /><text x="390" y="403" font-family="Menlo,monospace" font-size="12" fill="#eeeeea" text-anchor="middle">ESC</text><text x="462" y="403" font-family="Menlo,monospace" font-size="14" fill="#eeeeea" text-anchor="start">Pause</text><rect x="340.5" y="475.5" width="279" height="43" fill="#eeeeea" stroke="#eeeeea" /><text x="480.0" y="503" font-family="Menlo,monospace" font-size="15" fill="#25292e" text-anchor="middle">GOT IT</text></svg>